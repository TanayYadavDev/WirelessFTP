<!DOCTYPE html>
<html>
<head>
    <title>WirelessFTP</title>

    <style>
        body{
            background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .card{
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(15px);
            -webkit-backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,0.2);
            border-radius:25px;

            padding:40px;
            width:350px;

            box-shadow:0 8px 32px rgba(0,0,0,0.3);
            text-align:center;

            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 12px 40px rgba(59,130,246,0.3);
        }

        input{
            margin-top:20px;
        }

        button{
            margin-top:15px;
            padding:10px 20px;

            border:none;
            border-radius:10px;

            background:#3b82f6;
            color:white;

            cursor:pointer;
        }

        button:hover{
            background:#2563eb;
        }
        
        .ipbox{
            margin-top:20px;
            padding:10px;
            border-radius:12px;
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.1);
            font-size:14px;
            color:#cbd5e1;
        }

        .upload-box{
            display:block;
            margin-top:25px;
            padding:30px;

            border:2px dashed rgba(255,255,255,0.3);
            border-radius:20px;

            cursor:pointer;
            transition:0.3s;
        }

        .upload-box:hover{
            background:rgba(255,255,255,0.08);
            border-color:#60a5fa;
        }

        .upload-content h3{
            margin:0;
            font-size:20px;
        }

        .upload-content p{
            color:#cbd5e1;
            font-size:14px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>WirelessFTP</h1>
        <p>Fast local file sharing.</p>
        <div class="ipbox">
            Connected via {{ ip }}
        </div>
        <form method="POST" enctype="multipart/form-data">
            <label class="upload-box">
            <input type="file" name="file" hidden>
            <div class="upload-content">
                <h3>Drop files here</h3>
                <p>or click to browse</p>
            </div>
            </label>

            <br>
            <button type="submit">
                Upload
            </button>
        </form>
    </div>

</body>
</html>
