<!DOCTYPE html>
<html>
<head>
    <title>WirelessFTP</title>

    <style>
        body{
            background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .card{
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(15px);
            -webkit-backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,0.2);
            border-radius:25px;

            padding:40px;
            width:350px;

            box-shadow:0 8px 32px rgba(0,0,0,0.3);
            text-align:center;

            transition:0.3s;
        }
        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 12px 40px rgba(59,130,246,0.3);
        }

        input{
            margin-top:20px;
        }
        
        .ipbox{
            margin-top:20px;
            padding:10px;
            border-radius:12px;
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.1);
            font-size:14px;
            color:#cbd5e1;
        }

        .qrbox{
            margin-top:20px;
        }
        .qrbox img{
            width:150px;
            border-radius:15px;
            background:white;
            padding:10px;
        }

        .upload-box{
            display:block;
            margin-top:25px;
            padding:30px;

            border:2px dashed rgba(255,255,255,0.3);
            border-radius:20px;

            cursor:pointer;
            transition:0.3s;
        }
        .upload-box.active{
            background:rgba(96,165,250,0.12);
            border-color:#60a5fa;
            box-shadow:0 0 25px rgba(96,165,250,0.25);
        }
        .upload-box:hover{
            background:rgba(255,255,255,0.08);
            border-color:#60a5fa;
        }
        .upload-content h3{
            margin:0;
            font-size:20px;
        }
        .upload-content p{
            color:#cbd5e1;
            font-size:14px;
        }

        .files{
            margin-top:30px;
            text-align:left;
        }
        .file-item{
            padding:12px;
            margin-top:10px;
            border-radius:12px;
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.1);
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .file-item a{
            text-decoration:none;
            color:#60a5fa;
            font-size:14px;
        }
        .file-item a:hover{
            color:#93c5fd;
        }

        .selected-file{
            display:none;
            margin-top:20px;
            padding:15px;
            border-radius:15px;
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.1);
            color:#cbd5e1;
        }
        
        #uploadBtn{
            display:none;
            margin-top:20px;
            padding:10px 20px;
            border:none;
            border-radius:10px;
            background:#3b82f6;
            color:white;
            cursor:pointer;
        }
        #uploadBtn:hover{
            background:#2563eb;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>WirelessFTP</h1>
        <p>Fast local file sharing.</p>
        <div class="ipbox">
            Connected via {{ ip }}
        </div>
        <div class="qrbox">
            <img src="/static/qrcode.png">
        </div>
        <form id="uploadForm" method="POST" enctype="multipart/form-data">
            <label class="upload-box" id="dropArea">
            <input type="file" name="file" id="fileInput" hidden>
            <div class="upload-content">
                <h3>Drop files here</h3>
                <p>or click to browse</p>
            </div>
            </label>

            <br>
            <div class="selected-file" id="selectedFile">
                No file selected
            </div>
            <button id="uploadBtn" type="button">
                Upload
            </button>
        </form>
        <div class="files">
            <h3>Uploaded Files</h3>
            {% for file in files %}
                <div class="file-item">
                    <span>{{ file }}</span>
                    <a href="/download/{{ file }}" download>
                        Download
                    </a>
                </div>
            {% endfor %}
        </div>
    </div>

    <script>
        let currentFile=null;

        let dropArea=document.getElementById("dropArea");
        let fileInput=document.getElementById("fileInput");
        let selectedFile=document.getElementById("selectedFile");
        let uploadBtn=document.getElementById("uploadBtn");

        dropArea.addEventListener("click",function(){
            fileInput.click();
        });
        fileInput.addEventListener("change",function(){
            let file=fileInput.files[0];
            uploadFile(file);
        });
        dropArea.addEventListener("dragover",function(e){
            e.preventDefault();
            dropArea.classList.add("active");
        });
        dropArea.addEventListener("dragleave",function(){
            dropArea.classList.remove("active");
        });
        dropArea.addEventListener("drop",function(e){
            e.preventDefault();
            dropArea.classList.remove("active");
            let file=e.dataTransfer.files[0];
            uploadFile(file);
        });

        uploadBtn.addEventListener("click",function(){
            let formData=new FormData();
            formData.append("file",currentFile);
            selectedFile.innerHTML=
                "Uploading: "+currentFile.name;
            fetch("/",{
                method:"POST",
                body:formData
            })
            .then(response=>{
                selectedFile.innerHTML=
                    "Uploaded: "+currentFile.name+" 😭🔥";
                location.reload();
            });
        });

        function uploadFile(file){
            dropArea.style.display="none";
            selectedFile.style.display="block";
            selectedFile.innerHTML=
                "Uploading: "+file.name;
            let formData=new FormData();
            formData.append("file",file);
            fetch("/",{
                method:"POST",
                body:formData
            })
            .then(response=>{
                selectedFile.innerHTML=
                    "Uploaded: "+file.name+" 😭🔥";
                location.reload();
            });
        }

        function uploadFile(file){
            currentFile=file;
            dropArea.style.display="none";
            selectedFile.style.display="block";
            uploadBtn.style.display="inline-block";
            selectedFile.innerHTML=
                "Selected: "+file.name;
        }
    </script>
</body>
</html>
